services:
  literary-db:
    image: mongo:latest
    container_name: literary-db
    restart: unless-stopped
    networks:
      - literary-network
    volumes:
      - mongo_data:/data/db

  literary-backend:
    build: ./server
    image: literary-backend
    container_name: literary-backend
    restart: unless-stopped
    ports:
      - "4000:5000"
    environment:
      - MONGODB_URL=mongodb://literary-db:27017/literary-lounge
    networks:
      - literary-network
    depends_on:
      - literary-db

  literary-frontend:
    build: ./client
    image: literary-frontend
    container_name: literary-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    networks:
      - literary-network
    depends_on:
      - literary-backend

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    networks:
      - literary-network

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -c
      - |
        cat <<EOF > /etc/prometheus/prometheus.yml
        global:
          scrape_interval: 15s
        scrape_configs:
          - job_name: 'app-server'
            static_configs:
              - targets: ['node-exporter:9100']
        EOF
        /bin/prometheus --config.file=/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - literary-network
    depends_on:
      - node-exporter

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - literary-network
    depends_on:
      - prometheus

networks:
  literary-network:
    driver: bridge

volumes:
  mongo_data:
  grafana_data:
