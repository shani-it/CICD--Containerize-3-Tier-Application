services:
  literary-db:
    image: mongo:latest
    container_name: literary-db
    restart: unless-stopped
    networks:
      - literary-network
    volumes:
      - mongo_data:/data/db

  literary-backend:
    build: ./server
    image: literary-backend
    container_name: literary-backend
    restart: unless-stopped
    ports:
      - "4000:5000"
    environment:
      - MONGODB_URL=mongodb://literary-db:27017/literary-lounge
    networks:
      - literary-network
    depends_on:
      - literary-db

  literary-frontend:
    build: ./client
    image: literary-frontend
    container_name: literary-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    networks:
      - literary-network
    depends_on:
      - literary-backend

networks:
  literary-network:
    driver: bridge

volumes:
  mongo_data:
